name: Release

on:
  # The button in the Actions tab: svu picks the version from the commits.
  workflow_dispatch:
  # A tag pushed by hand releases exactly that version.
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: ci
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # svu and the changelog both read the commits since the last tag.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: github.event_name == 'workflow_dispatch'
        run: |
          current=$(go run github.com/caarlos0/svu/v3@v3.4.1 current)
          next=$(go run github.com/caarlos0/svu/v3@v3.4.1 next)
          if [ "$next" = "$current" ]; then
            echo "::error::No feat or fix since $current, so there is nothing to release."
            exit 1
          fi
          git tag "$next"
          git push origin "$next"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
