# cjx firewall: minimal Squid CONNECT-only proxy with domain allowlist.
# Allowlist is bind-mounted from the host at /etc/cjx/allowlist (one entry per
# line; a leading "." matches subdomains as well as the apex).

http_port 8080

acl allowed_dst dstdomain "/etc/cjx/allowlist"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access allow CONNECT SSL_ports allowed_dst
http_access deny all

# CONNECT-only proxy; we never cache.
cache deny all

# Logs to stdout so `podman logs` and `docker logs` work.
access_log stdio:/dev/stdout combined
cache_log /dev/stdout
logfile_rotate 0

# Hand-pick public resolvers so the firewall works regardless of the host's
# DNS configuration.
dns_nameservers 1.1.1.1 8.8.8.8

# No client identity disclosure to upstreams.
forwarded_for delete

# Squid runs in foreground (-N), no PID file needed.
pid_filename none

# Reasonable defaults for a small embedded proxy.
shutdown_lifetime 1 second
pipeline_prefetch off

# CAP_NET_RAW is dropped, so the ICMP pinger cannot open its socket and
# spins on retries before giving up. Skip it to keep startup fast.
pinger_enable off
